<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOICE BREAK</title>
<style>
:root{
  --bg:#070b14; --fg:#e8f0ff; --dim:#8da0c4; --accent:#35e0ff; --warn:#ffcf4a;
  --bad:#ff5a6a; --ok:#5dff9a; --panel:rgba(10,16,32,.92); --line:rgba(120,170,255,.28);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans JP",sans-serif;
  -webkit-user-select:none;user-select:none}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
#wrap{position:relative;width:min(100vw,calc((100vh - 58px) * 16 / 9));aspect-ratio:16/9;background:#000;overflow:hidden;
  box-shadow:0 0 40px rgba(53,224,255,.12);font-size:16px}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;inset:0;pointer-events:none;z-index:6}
#hudTop{position:absolute;left:.8em;top:.7em;width:19em;display:none}
#stName{font-size:.8em;font-weight:700;color:#cfe6ff;text-shadow:0 1px 3px #000;margin-bottom:.35em}
.barrow{display:flex;align-items:center;gap:.4em;margin-bottom:.28em}
.lb{font-size:.72em;width:2.6em;color:#bcd;text-shadow:0 1px 2px #000}
.bar{position:relative;flex:1;height:1.05em;border:1px solid rgba(255,255,255,.55);background:rgba(0,0,0,.55);border-radius:.3em;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;transition:width .12s}
.bar.hp i{background:linear-gradient(#7dff8d,#1fb94a)}
.bar.sp i{background:linear-gradient(#7de7ff,#2a7dff)}
.bar.sp.ready{box-shadow:0 0 .9em var(--accent);border-color:var(--accent)}
.bar b{position:absolute;inset:0;text-align:center;font-size:.66em;line-height:1.6;text-shadow:0 1px 2px #000;font-weight:700}
.itemrow{font-size:.74em;display:flex;gap:.8em;flex-wrap:wrap;text-shadow:0 1px 2px #000}
#buffTag{color:#ffb35a}
#poseTag{color:#ffe27a;font-size:.74em;margin-top:.2em;text-shadow:0 1px 2px #000;min-height:1em}
#status{position:absolute;right:.8em;top:.7em;display:flex;flex-direction:column;gap:.3em;align-items:flex-end}
.tag{font-size:.72em;padding:.18em .7em;border-radius:1em;background:rgba(0,0,0,.6);border:1px solid var(--line);white-space:nowrap}
.tag::before{content:"";display:inline-block;width:.6em;height:.6em;border-radius:50%;margin-right:.45em;background:#889;vertical-align:baseline}
.tag.ok::before{background:var(--ok);box-shadow:0 0 .5em var(--ok)}
.tag.bad::before{background:var(--bad);box-shadow:0 0 .5em var(--bad)}
.tag.warn::before{background:var(--warn);box-shadow:0 0 .5em var(--warn)}
.tag.hear::before{background:var(--accent);box-shadow:0 0 .7em var(--accent)}
#toasts{position:absolute;left:.8em;top:9.4em;display:flex;flex-direction:column;gap:.3em;align-items:flex-start}
.toast{font-size:.85em;font-weight:700;padding:.3em .8em;border-radius:.4em;background:rgba(20,30,60,.88);border-left:.3em solid var(--accent);
  animation:toastLife 2.6s forwards;text-shadow:0 1px 2px #000}
@keyframes toastLife{0%{opacity:0;transform:translateX(-1em)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#bottom{position:absolute;left:0;right:0;bottom:0;padding:.4em .8em;display:flex;gap:1.2em;align-items:center;justify-content:space-between;
  background:linear-gradient(transparent,rgba(0,0,0,.72));font-size:.82em;min-height:2.4em}
#bottom .k{color:var(--dim);margin-right:.5em;font-size:.85em}
#lastCmd .v{font-weight:800;color:var(--accent);font-size:1.15em}
#heard .v{color:#fff}
#heard .v.interim{color:#9ab;font-style:italic}
#warn{position:absolute;left:50%;top:38%;transform:translateX(-50%);width:34em;max-width:92%;display:none;
  background:rgba(60,10,20,.95);border:2px solid var(--bad);border-radius:.6em;padding:.8em 1em;font-size:.85em;line-height:1.6;pointer-events:auto}
#overlay{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(3,6,14,.82);overflow:auto}
#overlay.show{display:flex}
.panel{width:min(52em,94%);max-height:96%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:.8em;padding:1.1em 1.5em;text-align:center}
h1{margin:.1em 0 0;font-size:3.2em;letter-spacing:.12em;background:linear-gradient(90deg,#35e0ff,#9b7bff,#ff5fa2);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 .3em rgba(53,224,255,.45))}
h2{font-size:1.05em;margin:.5em 0 .3em;color:var(--accent)}
.sub{color:var(--dim);font-size:.9em;margin:.2em 0 .6em}
.cols{display:flex;gap:1.2em;text-align:left;font-size:.78em;line-height:1.55}
.cols>div{flex:1;min-width:0}
.cols ul{margin:.2em 0;padding-left:1.2em}
table.cmd{width:100%;border-collapse:collapse;font-size:1em}
table.cmd td{padding:.1em .35em;border-bottom:1px solid rgba(255,255,255,.08)}
table.cmd td:first-child{color:var(--accent);font-weight:800;white-space:nowrap}
.checks{margin:.6em 0;font-size:.76em;text-align:left;display:grid;grid-template-columns:1fr 1fr;gap:.2em 1em}
.checks .ok{color:var(--ok)} .checks .ng{color:var(--bad)} .checks .wn{color:var(--warn)}
.btn{font:inherit;font-size:1.05em;font-weight:800;color:#001018;background:linear-gradient(90deg,#35e0ff,#7fb0ff);border:0;border-radius:2em;padding:.65em 1.8em;cursor:pointer;
  box-shadow:0 0 1em rgba(53,224,255,.45);margin:.3em .3em}
.btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);box-shadow:none;font-size:.8em;padding:.4em 1.2em;font-weight:600}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.note{font-size:.72em;color:var(--dim);line-height:1.6;margin:.5em 0 0;text-align:left}
.big{font-size:2em;font-weight:800;margin:.3em 0}
.big b{color:var(--accent)}
.stat{font-size:.95em;margin:.4em 0}
.heardbox{margin:.5em auto;min-height:3.2em;max-width:30em;background:rgba(255,255,255,.06);border:1px dashed var(--line);border-radius:.5em;padding:.5em .8em;font-size:.9em;text-align:left}
.heardbox div{opacity:.95}
.success{color:var(--ok);font-weight:800;font-size:1.2em}
.fail{color:var(--bad)}
.steps{text-align:left;font-size:.8em;line-height:1.7;margin:.4em 0}
#cmdbar{height:58px;width:min(100vw,calc((100vh - 58px) * 16 / 9));display:flex;gap:.35em;align-items:center;justify-content:center;flex-wrap:wrap;padding:.2em .4em;font-size:12px}
.chip{padding:.25em .65em;border-radius:.6em;background:#101a30;border:1px solid var(--line);color:#bcd;text-align:center;line-height:1.25;transition:all .15s}
.chip b{display:block;color:var(--accent);font-size:1.15em}
.chip small{color:var(--dim);font-size:.82em}
.chip.on{background:var(--accent);color:#001018;transform:translateY(-2px);box-shadow:0 0 .9em var(--accent)}
.chip.on b,.chip.on small{color:#001018}
@media (max-width:700px){ .cols{flex-direction:column} h1{font-size:2.2em} #cmdbar{font-size:10px} }
</style>
</head>
<body>
<div id="app">
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div id="hudTop">
        <div id="stName"></div>
        <div class="barrow"><span class="lb">体力</span><div class="bar hp"><i id="hpBar"></i><b id="hpTxt"></b></div></div>
        <div class="barrow"><span class="lb">必殺技</span><div class="bar sp" id="spWrap"><i id="spBar"></i><b id="spTxt"></b></div></div>
        <div class="itemrow"><span id="potions"></span><span id="buffTag"></span></div>
        <div id="poseTag"></div>
      </div>
      <div id="status"><span class="tag" id="micTag"></span><span class="tag" id="asrTag"></span></div>
      <div id="toasts"></div>
      <div id="bottom">
        <div id="lastCmd"><span class="k">最後のコマンド</span><span class="v">―</span></div>
        <div id="heard"><span class="k">認識した言葉</span><span class="v">―</span></div>
      </div>
      <div id="warn"></div>
    </div>
    <div id="overlay"></div>
  </div>
  <div id="cmdbar"></div>
</div>

<script>
'use strict';
(() => {
/* =====================================================================
   VOICE BREAK  ―  声だけで遊ぶ2Dアクション
   構成: 1) 定数  2) 音声認識  3) ゲーム状態  4) ステージ定義
         5) 更新処理  6) 描画処理  7) UI/メインループ
   ===================================================================== */

// ---------------------------------------------------------------- 1) 定数
const W = 960, H = 540, GY = 440, GRAV = 2000;
const WALK = 235, DASHV = 560, DASH_T = 0.38, DASH_INV = 0.6, JUMPV = 650, MOVE_TIME = 2.4;
const SP_COST = 60, SP_MAX = 100, ATK_W = 88;
const STAND_H = 62, CROUCH_H = 34, PW = 34;
const FONT = '"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans JP",sans-serif';

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const wrap = $('wrap');
let scale = 1;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const rand = (a, b) => a + Math.random() * (b - a);
const hash = k => { const s = Math.sin(k * 12.9898) * 43758.5453; return s - Math.floor(s); };
const rectsOverlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

// コマンド定義（words は正規化後＝カタカナ→ひらがな済みの文字列）
const CMDS = {
  right:   { label: '右',       words: ['右', 'みぎ'], cd: 140 },
  left:    { label: '左',       words: ['左', 'ひだり'], cd: 140 },
  jump:    { label: 'ジャンプ', words: ['じゃんぷ', 'じゃんぶ', 'じゃんぱ', '跳べ', '飛べ', '跳ぶ', '飛ぶ', 'とべ'], cd: 450 },
  crouch:  { label: 'しゃがめ', words: ['しゃがめ', 'しゃがむ', 'しゃがんで', 'しゃがみ', 'しゃがま', 'しゃが', 'かがめ', 'かがんで', '屈め', '屈んで', '伏せ'], cd: 300 },
  stand:   { label: '立て',     words: ['立ち上がれ', 'たちあがれ', '立ちなさい', '立って', 'たって', '立て', 'たて', '立つ', '建て', '縦', '起きろ', 'おきろ'], cd: 300, strict: true },
  attack:  { label: '攻撃',     words: ['攻撃', 'こうげき', 'あたっく', '撃て', '打て'], cd: 380 },
  dash:    { label: 'ダッシュ', words: ['だっしゅ', 'たっしゅ', '走れ', 'はしれ', '走って', '急げ', 'いそげ'], cd: 700 },
  stop:    { label: '止まれ',   words: ['止まれ', 'とまれ', '止まって', 'とまって', '止まる', 'すとっぷ', '停止'], cd: 250 },
  special: { label: '必殺技',   words: ['必殺技', 'ひっさつわざ', 'ひっさつ', '必殺'], cd: 1200 },
  heal:    { label: '回復',     words: ['回復', 'かいふく', 'ひーる'], cd: 1000 },
  // メニュー用（ゲームプレイ中は無視）
  retry:   { label: 'もう一度', words: ['もう一度', 'もういちど', 'りとらい', 'やり直し', 'やりなおし', '再開', 'さいかい'], cd: 900 },
  restart: { label: 'はじめから', words: ['はじめから', '初めから', '最初から', 'さいしょから'], cd: 900 }
};
const CHIPS = [
  ['right', '右', '右へ移動'], ['left', '左', '左へ移動'], ['jump', 'ジャンプ', '跳ぶ'], ['crouch', 'しゃがめ', '姿勢を低く'],
  ['stand', '立て', 'しゃがみ解除'], ['attack', '攻撃', '通常攻撃'], ['dash', 'ダッシュ', '高速移動'],
  ['stop', '止まれ', '停止'], ['special', '必殺技', '強攻撃'], ['heal', '回復', '薬を使う']
];
const NOISE = ['左右'];
const PATTERNS = [];
for (const id in CMDS) for (const w of CMDS[id].words) PATTERNS.push({ w, id });
PATTERNS.sort((a, b) => b.w.length - a.w.length);

// ------------------------------------------------------------ 2) 音声認識
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const V = {
  supported: !!SR,
  secure: window.isSecureContext !== false,
  mic: 'idle',        // idle | asking | granted | denied | nodevice | busy | error | unsupported
  rec: 'off',         // off | starting | listening | restarting | error
  speaking: false, want: false, fatal: '', obj: null, fastFails: 0, startedAt: 0, restartTimer: 0,
  lastCmdTime: {}, lastHeard: '', testMode: false
};
const perResult = new Map();   // 認識結果ごとに「すでに実行したコマンド数」を覚える（重複実行防止）
let fakeIndex = 0;

function norm(s) {
  s = String(s).normalize('NFKC').replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  return s.replace(/[\s、。，．,.!?！？「」『』（）()…～~・\-]/g, '').toLowerCase();
}
// 文章から命令語を左から順に抜き出す。resid = 命令語以外の文字数
function tokenize(text) {
  const s = norm(text); const toks = []; let i = 0, resid = 0;
  while (i < s.length) {
    let len = 0, id = null;
    for (const n of NOISE) if (s.startsWith(n, i)) { len = n.length; break; }
    if (!len) for (const pt of PATTERNS) if (s.startsWith(pt.w, i)) { len = pt.w.length; id = pt.id; break; }
    if (len) { if (id) toks.push(id); i += len; } else { resid++; i++; }
  }
  return { toks, resid, len: s.length };
}

function handleResult(ev) {
  for (let i = ev.resultIndex; i < ev.results.length; i++) {
    const r = ev.results[i];
    if (!r || !r[0]) continue;
    const isFinal = !!r.isFinal;
    const text = r[0].transcript || '';
    showHeard(text, isFinal);
    let tk = tokenize(text);
    let toks = tk.toks;
    if (isFinal && toks.length === 0) {          // 確定結果で何も拾えない時だけ、候補2位以下を厳しめに確認
      for (let a = 1; a < r.length; a++) {
        const t2 = tokenize(r[a].transcript || '');
        if (t2.toks.length && t2.resid <= 1 && !t2.toks.some(id => CMDS[id].strict)) { toks = t2.toks; tk = t2; break; }
      }
    }
    let rec = perResult.get(i);
    if (!rec) { rec = { cnt: {} }; perResult.set(i, rec); }
    const seen = {};
    for (const id of toks) {
      seen[id] = (seen[id] || 0) + 1;
      if (seen[id] <= (rec.cnt[id] || 0)) continue;           // この認識結果で実行済み
      if (CMDS[id].strict) {                                    // 「立て」は確定結果かつ、ほぼ単独発話のみ（しゃがみの誤解除防止）
        if (!isFinal || tk.resid > 1) continue;
      }
      rec.cnt[id] = (rec.cnt[id] || 0) + 1;
      dispatch(id);
    }
  }
}

function dispatch(id) {
  const now = performance.now();
  const def = CMDS[id];
  if (now - (V.lastCmdTime[id] || -1e9) < def.cd) return;      // 同一コマンドのクールダウン
  V.lastCmdTime[id] = now;
  setLastCmd(def.label);
  flashChip(id);
  onCommand(id);
}

function createRec() {
  const r = new SR();
  r.lang = 'ja-JP'; r.continuous = true; r.interimResults = true; r.maxAlternatives = 3;
  r.onstart = () => { V.rec = 'listening'; V.startedAt = performance.now(); perResult.clear(); refreshStatus(); };
  r.onspeechstart = () => { V.speaking = true; refreshStatus(); };
  r.onspeechend = () => { V.speaking = false; refreshStatus(); };
  r.onresult = handleResult;
  r.onerror = e => {
    const err = e && e.error;
    if (err === 'no-speech' || err === 'aborted') return;
    if (err === 'not-allowed' || err === 'service-not-allowed') {
      V.mic = 'denied'; fatalRec('マイクまたは音声認識の使用が許可されていません。',
        'アドレスバー左のアイコンからマイクを「許可」にし、ページを再読み込みしてください。');
    } else if (err === 'audio-capture') {
      V.mic = 'nodevice'; fatalRec('マイクが見つからないか、使用できません。', 'マイクを接続し、OSの入力デバイス設定を確認してください。他のアプリがマイクを占有していないかも確認してください。');
    } else if (err === 'language-not-supported') {
      fatalRec('日本語の音声認識がこのブラウザで使えません。', 'ブラウザの言語設定・音声認識の対応言語を確認してください。');
    } else if (err === 'network') {
      V.rec = 'restarting'; showWarn('音声認識サービスに接続できません（ネットワーク）。', 'インターネット接続を確認してください。接続が戻ると自動で再開します。', false);
    } else {
      V.rec = 'restarting';
    }
    refreshStatus();
  };
  r.onend = () => {
    V.speaking = false;
    if (!V.want || V.fatal) { V.rec = V.fatal ? 'error' : 'off'; refreshStatus(); return; }
    const life = performance.now() - V.startedAt;
    V.fastFails = life < 900 ? Math.min(V.fastFails + 1, 12) : 0;
    V.rec = 'restarting'; refreshStatus();
    clearTimeout(V.restartTimer);
    V.restartTimer = setTimeout(startRec, 150 + V.fastFails * 300);
  };
  return r;
}
function startRec() {
  if (!SR || V.fatal) return;
  V.want = true;
  if (!V.obj) V.obj = createRec();
  try { V.obj.start(); V.rec = 'starting'; }
  catch (e) { /* 既に開始済み(InvalidStateError)は問題なし */ }
  refreshStatus();
}
function stopRec() {
  V.want = false; clearTimeout(V.restartTimer);
  try { V.obj && V.obj.abort(); } catch (e) { /* 無視 */ }
}
function fatalRec(msg, fix) {
  V.fatal = msg; V.want = false; V.rec = 'error';
  if (G.state === 'test') showMicProblem(msg, fix); else showWarn(msg, fix, true);
}
async function requestMic() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { V.mic = 'unsupported'; return 'unsupported'; }
  V.mic = 'asking'; refreshStatus();
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
    s.getTracks().forEach(t => t.stop());
    V.mic = 'granted'; return 'ok';
  } catch (e) {
    const n = e && e.name;
    if (n === 'NotAllowedError' || n === 'SecurityError' || n === 'PermissionDeniedError') V.mic = 'denied';
    else if (n === 'NotFoundError' || n === 'DevicesNotFoundError') V.mic = 'nodevice';
    else if (n === 'NotReadableError' || n === 'TrackStartError') V.mic = 'busy';
    else V.mic = 'error';
    return V.mic;
  } finally { refreshStatus(); }
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && V.want && !V.fatal && V.rec !== 'listening') { clearTimeout(V.restartTimer); startRec(); }
});

// ------------------------------------------------------------ 3) ゲーム状態
const G = {
  state: 'intro', stateT: 0, t: 0, stageIdx: 0, stage: null, p: null, boss: null,
  enemies: [], eprojs: [], pwaves: [], items: [], parts: [], pops: [], hazards: null,
  cam: 0, shake: 0, hurtFlash: 0, callout: null, bossBanner: null, itemTimer: 8, stats: { kills: 0, time: 0 }, uid: 0
};

function newPlayer(carry) {
  return { x: 100, y: GY, vx: 0, vy: 0, w: PW, h: STAND_H, face: 1, crouch: false, onGround: true, blocked: false,
    moveDir: 0, moveTimer: 0, dashT: 0, dashInv: 0, dashCool: 0, atkT: 0, atkCool: 0, atkHit: new Set(), spT: 0,
    hp: 100, maxhp: 100, gauge: carry.gauge, potions: carry.potions, buff: 0, invuln: 0, walkT: 0, safeX: 100, dead: false, healFx: 0 };
}
const pRect = () => { const p = G.p; return { x: p.x - p.w / 2, y: p.y - p.h, w: p.w, h: p.h }; };
const enemyRect = e => e.type === 'flyer'
  ? { x: e.x - e.w / 2, y: e.y - e.h / 2, w: e.w, h: e.h }
  : { x: e.x - e.w / 2, y: e.y - e.h, w: e.w, h: e.h };
const projRect = q => ({ x: q.x - q.w / 2, y: q.y - q.h / 2, w: q.w, h: q.h });
const bossRect = b => ({ x: b.x - b.w / 2, y: b.y - b.h, w: b.w, h: b.h });

// ---------------------------------------------------------- 4) ステージ定義
function mkEnemy(type, x, o = {}) {
  const base = {
    grunt:   { w: 34, h: 56, hp: 30 },
    shooter: { w: 34, h: 58, hp: 24 },
    chaser:  { w: 48, h: 30, hp: 22 },
    flyer:   { w: 40, h: 24, hp: 20 },
    brute:   { w: 74, h: 94, hp: 100 }
  }[type];
  return Object.assign({ type, x, y: type === 'flyer' ? GY - 56 : GY, by: GY - 56, w: base.w, h: base.h, hp: base.hp, maxhp: base.hp,
    vx: 0, vy: 0, kv: 0, dir: -1, st: 'idle', t: 0, home: x, hitF: 0, onGround: true, blocked: false, dead: false,

// ---------------------------------------------------------- 5) 更新処理
function overGround(x) { const g = G.stage.ground; for (let i = 0; i < g.length; i++) if (x > g[i][0] - 6 && x < g[i][1] + 6) return true; return false; }

// プレイヤー・敵共通の物理（重力・着地・ブロック衝突）
function moveBody(b, dt, gs) {
  const S = G.stage; const prevY = b.y;
  b.blocked = false;
  b.x += b.vx * dt;
  for (const k of S.blocks) {
    if (b.x + b.w / 2 > k.x && b.x - b.w / 2 < k.x + k.w && b.y > k.y + 2 && b.y - b.h < k.y + k.h) {
      b.x = b.x < k.x + k.w / 2 ? k.x - b.w / 2 : k.x + k.w + b.w / 2; b.vx = 0; b.blocked = true;
    }
  }
  b.vy = Math.min(b.vy + GRAV * (gs === undefined ? 1 : gs) * dt, 1100);
  b.y += b.vy * dt;
  let floor = Infinity;
  if (overGround(b.x)) floor = GY;
  for (const k of S.blocks) if (b.x + b.w / 2 - 3 > k.x && b.x - b.w / 2 + 3 < k.x + k.w && prevY <= k.y + 10) floor = Math.min(floor, k.y);
  b.onGround = false;
  if (b.vy >= 0 && b.y >= floor && prevY <= floor + 12) { b.y = floor; b.vy = 0; b.onGround = true; }
}

function updatePlayer(dt) {
  const p = G.p, S = G.stage;
  p.h = p.crouch ? CROUCH_H : STAND_H;
  p.invuln = Math.max(0, p.invuln - dt); p.dashInv = Math.max(0, p.dashInv - dt); p.dashCool = Math.max(0, p.dashCool - dt);
  p.atkCool = Math.max(0, p.atkCool - dt); p.buff = Math.max(0, p.buff - dt); p.healFx = Math.max(0, p.healFx - dt); p.spT = Math.max(0, p.spT - dt);
  if (p.atkT > 0) p.atkT -= dt;
  if (p.dashT > 0) p.dashT -= dt;
  if (p.moveDir) { p.moveTimer -= dt; if (p.moveTimer <= 0) { p.moveDir = 0; p.moveTimer = 0; } }   // 移動は一定時間で自動停止
  if (p.dashT > 0) p.vx = p.face * DASHV;
  else {
    const target = p.crouch ? 0 : p.moveDir * WALK;
    p.vx = approach(p.vx, target, (p.crouch ? 6000 : (p.onGround ? 2400 : 1500)) * dt);
  }
  moveBody(p, dt, p.dashT > 0 ? 0.35 : 1);
  p.walkT += dt * Math.abs(p.vx) / WALK;
  p.x = clamp(p.x, PW / 2, S.width - PW / 2);
  if (p.onGround && p.y === GY && overGround(p.x - 70) && overGround(p.x + 70) && !S.blocks.some(k => p.x > k.x - 40 && p.x < k.x + k.w + 40)) p.safeX = p.x;
  if (p.y > H + 120 && !p.dead) {                       // 穴に落下
    p.hp -= 20; pop(p.safeX, GY - 90, '穴に落下！ -20', '#ff8a8a');
    G.hurtFlash = 0.35; G.shake = 0.3;
    if (p.hp <= 0) { p.hp = 0; p.dead = true; setState('dying'); return; }
    p.x = p.safeX; p.y = GY; p.vx = 0; p.vy = 0; p.moveDir = 0; p.moveTimer = 0; p.invuln = 1.6; p.dashT = 0;
  }
  // 攻撃判定
  if (p.atkT > 0.05 && p.atkT < 0.24) {
    const box = attackBox();
    const dmg = 10 * (p.buff > 0 ? 1.8 : 1);
    for (const e of G.enemies) if (!e.dead && !p.atkHit.has(e) && rectsOverlap(box, enemyRect(e))) { p.atkHit.add(e); damageEnemy(e, dmg, false); }
    const b = G.boss;
    if (b && !p.atkHit.has(b) && !b.dead && rectsOverlap(box, bossRect(b))) { p.atkHit.add(b); damageBoss(dmg, 'basic'); }
    for (let i = G.eprojs.length - 1; i >= 0; i--) {
      const q = G.eprojs[i];
      if (q.deflect && rectsOverlap(box, projRect(q))) { sparks(q.x, q.y, 8, '#fff'); G.eprojs.splice(i, 1); p.gauge = Math.min(SP_MAX, p.gauge + 2); pop(q.x, q.y - 14, '弾を消した', '#bff'); }
    }
  }
}
const attackBox = () => { const p = G.p; return { x: p.face > 0 ? p.x + 2 : p.x - 2 - ATK_W, y: p.y - p.h + 4, w: ATK_W, h: p.h - 8 }; };

function hurtPlayer(dmg, srcX) {
  const p = G.p;
  if (p.dead || p.invuln > 0 || p.dashInv > 0 || G.state === 'stageClear') return false;
  p.hp -= dmg; p.invuln = 1.1; G.shake = Math.max(G.shake, 0.25); G.hurtFlash = 0.4;
  p.moveDir = 0; p.moveTimer = 0; p.dashT = 0;
  const away = p.x < srcX ? -1 : 1;
  if (p.crouch) p.vx = away * 80;                      // しゃがみ状態はダメージでも維持される
  else { p.vx = away * 200; if (p.onGround) { p.vy = -260; p.onGround = false; } }
  pop(p.x, p.y - p.h - 12, '-' + dmg, '#ff6a6a'); sparks(p.x, p.y - p.h / 2, 10, '#ff6a6a');
  if (p.hp <= 0) { p.hp = 0; p.dead = true; p.vx = 0; setState('dying'); }
  return true;
}

function fireProj(x, y, vx, kind, dmg) {
  const sz = { low: [22, 16], high: [22, 16], shock: [40, 30], web: [26, 18] }[kind] || [22, 16];
  G.eprojs.push({ x, y, w: sz[0], h: sz[1], vx, kind, dmg, deflect: true, life: 3, x0: x });
}

function walker(e, dt, want) {
  let vx = want;
  if (e.onGround && want !== 0 && !overGround(e.x + Math.sign(want) * (e.w / 2 + 14))) vx = 0;
  e.vx = vx + e.kv;
  moveBody(e, dt, 1);
  e.x = clamp(e.x, e.w / 2, G.stage.width - e.w / 2);
  if (e.y > H + 150) { e.dead = true; e.noDrop = true; }
}

function updateEnemies(dt) {
  const p = G.p;
  for (const e of G.enemies) {
    if (e.dead) continue;
    e.hitF = Math.max(0, e.hitF - dt);
    if (Math.abs(e.x - p.x) > 1100) continue;
    e.t += dt; e.kv = approach(e.kv, 0, 900 * dt);
    const dx = p.x - e.x, adx = Math.abs(dx), near = Math.abs(p.y - e.y) < 120 && !p.dead;
    switch (e.type) {
      case 'grunt':
        if (e.st === 'idle') {
          if (e.x > e.home + 110) e.pd = -1; if (e.x < e.home - 110) e.pd = 1;
          e.dir = e.pd; walker(e, dt, e.pd * 40);
          if (adx < 300 && near) e.st = 'chase';
        } else if (e.st === 'chase') {
          e.dir = dx >= 0 ? 1 : -1;
          if (adx > 400) e.st = 'idle';
          else if (adx <= 70) { e.st = 'wind'; e.t = 0; walker(e, dt, 0); }
          else walker(e, dt, e.dir * 85);
        } else if (e.st === 'wind') {                    // 予告：頭の高さを横薙ぎ → しゃがんで回避
          walker(e, dt, 0);
          if (e.t >= 0.6) { e.st = 'swing'; e.t = 0; e.did = false; }
        } else if (e.st === 'swing') {
          walker(e, dt, 0);
          if (!e.did) { e.did = true; if (rectsOverlap({ x: e.dir > 0 ? e.x : e.x - 72, y: e.y - 76, w: 72, h: 34 }, pRect())) hurtPlayer(12, e.x); }
          if (e.t >= 0.18) { e.st = 'rec'; e.t = 0; }
        } else { walker(e, dt, 0); if (e.t >= 0.8) { e.st = 'chase'; e.t = 0; } }
        break;
      case 'shooter':
        e.dir = dx >= 0 ? 1 : -1; walker(e, dt, 0);
        if (e.st === 'idle') {
          if (adx < 560 && adx > 40) {
            e.cd -= dt;
            if (e.cd <= 0) { e.st = 'aim'; e.t = 0; e.shot = e.aim === 'alt' ? ((e.altn++ % 2) ? 'high' : 'low') : (e.aim || 'low'); }
          }
        } else if (e.t >= 0.6) {
          fireProj(e.x + e.dir * 26, e.y - (e.shot === 'high' ? 52 : 22), e.dir * 250, e.shot, 10);
          e.st = 'idle'; e.cd = rand(2.2, 3);
        }
        break;
      case 'chaser':
        if (e.st === 'idle') {
          e.dir = e.pd; walker(e, dt, e.pd * 30);
          if (e.x > e.home + 90) e.pd = -1; if (e.x < e.home - 90) e.pd = 1;
          if (adx < 420 && near) e.st = 'chase';
        } else if (e.st === 'chase') {
          e.dir = dx >= 0 ? 1 : -1; walker(e, dt, e.dir * (e.spd || 150));
          if (e.blocked && e.onGround) e.vy = -520;
          if (rectsOverlap(enemyRect(e), pRect())) { hurtPlayer(10, e.x); e.st = 'back'; e.t = 0; e.kv = -e.dir * 300; }
          if (adx > 650) e.st = 'idle';
        } else { walker(e, dt, 0); if (e.t > 0.7) e.st = 'chase'; }
        break;
      case 'flyer':
        e.x += e.pd * 90 * dt;
        if (e.x > e.x1) e.pd = -1; if (e.x < e.x0) e.pd = 1;
        e.dir = e.pd; e.y = e.by + Math.sin(e.t * 3) * 4;
        e.cd -= dt;
        if (e.cd <= 0 && adx < 460 && (dx > 0) === (e.pd > 0)) { fireProj(e.x, e.y + 4, e.pd * 250, 'high', 9); e.cd = 3.2; }
        if (rectsOverlap(enemyRect(e), pRect())) hurtPlayer(8, e.x);
        break;
      case 'brute':
        if (e.st === 'idle') { walker(e, dt, 0); if (adx < 360 && near) e.st = 'walk'; }
        else if (e.st === 'walk') {
          e.dir = dx >= 0 ? 1 : -1;
          if (adx < 125) { e.st = 'wind'; e.t = 0; walker(e, dt, 0); }
          else { walker(e, dt, e.dir * 55); if (adx > 540) e.st = 'idle'; }
        } else if (e.st === 'wind') { walker(e, dt, 0); if (e.t >= 0.95) { e.st = 'slam'; e.t = 0; e.did = false; } }
        else if (e.st === 'slam') {                      // 叩きつけ：足元の攻撃 → ジャンプで回避
          walker(e, dt, 0);
          if (!e.did) {
            e.did = true;
            if (rectsOverlap({ x: e.dir > 0 ? e.x + 20 : e.x - 130, y: e.y - 34, w: 110, h: 34 }, pRect())) hurtPlayer(22, e.x);
            fireProj(e.x + e.dir * 60, e.y - 16, e.dir * 270, 'shock', 15); G.shake = 0.3;
          }
          if (e.t >= 0.25) { e.st = 'rec'; e.t = 0; }
        } else { walker(e, dt, 0); if (e.t >= 1.3) { e.st = 'walk'; e.t = 0; } }
        break;
    }
  }
  G.enemies = G.enemies.filter(e => !e.dead);
  G.stage.enemies = G.enemies;
}

function damageEnemy(e, dmg, special) {
  const p = G.p;
  e.hp -= dmg; e.hitF = 0.15;
  if (e.type !== 'flyer') e.kv = p.face * (e.type === 'brute' ? 60 : 260);
  if (e.type === 'grunt' && e.st === 'wind') { e.st = 'rec'; e.t = 0; }       // 構え中に攻撃すると怯む
  e.dir = e.dir || 1;
  pop(e.x, e.y - e.h - 8, Math.round(dmg), '#fff'); sparks(e.x, e.type === 'flyer' ? e.y : e.y - e.h / 2, 7, '#ffe27a');
  if (!special) p.gauge = Math.min(SP_MAX, p.gauge + 5);
  if (e.hp <= 0) {
    e.dead = true; G.stats.kills++; sparks(e.x, e.type === 'flyer' ? e.y : e.y - e.h / 2, 18, '#ff9a5a');
    if (!e.noDrop && (e.type === 'brute' || Math.random() < 0.3)) {
      const r = Math.random();
      G.items.push({ x: e.x, y: GY - 34, type: r < 0.45 ? 'heal' : (r < 0.8 ? 'gauge' : 'power'), t: 0, taken: false });
    }
  }
}

const BOSS_TELE = {
  sweep:  { t: 1.0,  text: '脚払い！ → 「ジャンプ」で衝撃波を飛び越えろ！' },
  spit:   { t: 0.95, text: '糸の弾！ → 「しゃがめ」で頭上をかわせ！' },

  rain:   { t: 0.9,  text: '天井から落下攻撃！ → 「右」「左」で動いて避けろ！' }
};
function setBoss(st, dur) { const b = G.boss; b.st = st; b.t = 0; b.dur = dur || 0; b.f1 = 0; b.f2 = 0; b.shots = 0; }

function startBossAttack() {
  const b = G.boss, p = G.p;
  const list = b.phase === 2 ? ['sweep', 'spit', 'charge', 'rain'] : ['sweep', 'spit', 'charge'];
  let k; do { k = list[(Math.random() * list.length) | 0]; } while (k === b.last);
  b.last = k; b.atk = k;
  const sp = b.phase === 2 ? 0.8 : 1;
  setBoss('tele', BOSS_TELE[k].t * sp);
  b.dir = p.x >= b.x ? 1 : -1;
  if (k === 'rain') {
    const offs = b.phase === 2 ? [0, -170, 170, -340, 340] : [0, -200, 200];
    b.cols = offs.map(o => ({ x: clamp(p.x + o, 60, G.stage.width - 60), t: -1 })).filter((c, i, a) => a.findIndex(d => Math.abs(d.x - c.x) < 60) === i);
  }
  G.bossBanner = { text: BOSS_TELE[k].text, t: b.dur + 0.5, color: '#ff8a8a' };
}

function updateBoss(dt) {
  const b = G.boss; if (!b) return;
  const p = G.p, S = G.stage;
  b.t += dt; b.hitF = Math.max(0, b.hitF - dt);
  if (b.st !== 'dead') b.phase = b.hp < b.maxhp * 0.5 ? 2 : 1;
  const dx = p.x - b.x, adx = Math.abs(dx);
  const p2 = b.phase === 2;
  switch (b.st) {
    case 'intro':
      if (!b.f1) { b.f1 = 1; G.bossBanner = { text: b.name + 'が出現！', t: 2.2, color: '#ffd24a' }; }
      if (b.t > 2.4) setBoss('idle', 1.1);
      break;
    case 'idle':
      b.dir = dx >= 0 ? 1 : -1;
      if (adx > 230) b.x += b.dir * 60 * dt;
      if (b.t >= b.dur) startBossAttack();
      break;
    case 'tele':
      if (b.atk !== 'rain') b.dir = dx >= 0 ? 1 : -1;
      if (b.atk === 'rain') for (const c of b.cols) c.t = -1;
      if (b.t >= b.dur) {
        const keep = b.cols, atk = b.atk;
        setBoss('atk', 0); b.atk = atk; b.cols = keep;
        if (atk === 'charge') { b.dir = dx >= 0 ? 1 : -1; b.travel = 0; }
        if (atk === 'rain') for (const c of b.cols) c.t = 0;
      }
      break;
    case 'atk':
      if (b.atk === 'sweep') {
        const spd = p2 ? 400 : 330;
        if (!b.f1) { b.f1 = 1; fireProj(b.x + b.dir * (b.w / 2 + 10), GY - 18, b.dir * spd, 'shock', 18); G.shake = 0.25; }
        if (p2 && !b.f2 && b.t > 0.55) { b.f2 = 1; fireProj(b.x + b.dir * (b.w / 2 + 10), GY - 18, b.dir * spd, 'shock', 18); G.shake = 0.2; }
        if (b.t >= (p2 ? 0.75 : 0.35)) endAttack(p2 ? 1.7 : 2.0);
      } else if (b.atk === 'spit') {
        const n = p2 ? 4 : 3;
        if (b.shots < n && b.t >= b.shots * 0.4) { fireProj(b.x + b.dir * (b.w / 2 + 6), GY - 52, b.dir * 400, 'web', 14); b.shots++; }
        if (b.shots >= n && b.t >= n * 0.4 + 0.2) endAttack(p2 ? 1.6 : 1.9);
      } else if (b.atk === 'charge') {
        const spd = Math.min(540, 170 + b.t * 520);
        b.x += b.dir * spd * dt; b.travel += spd * dt;
        G.shake = Math.max(G.shake, 0.12);
        if (Math.random() < 0.6) parts(b.x - b.dir * 60, GY - 4, 1, '#c9a', 80, -60);
        if (b.travel >= 800 || b.x <= b.w / 2 + 20 || b.x >= S.width - b.w / 2 - 20) {
          b.x = clamp(b.x, b.w / 2 + 20, S.width - b.w / 2 - 20);
          setBoss('stun', 3.2); G.shake = 0.5; sparks(b.x + b.dir * 80, GY - 60, 16, '#fff');
          G.bossBanner = { text: 'スタン！ 今だ「必殺技」！「攻撃」も有効！', t: 3.2, color: '#7cf3ff' };
        }
      } else if (b.atk === 'rain') {
        for (const c of b.cols) {
          c.t += dt;
          if (c.t > 0.05 && c.t < 0.45 && rectsOverlap({ x: c.x - 37, y: 0, w: 74, h: GY }, pRect())) hurtPlayer(18, c.x);
        }
        if (b.t >= 0.7) { b.cols = []; endAttack(1.5); }
      }
      break;
    case 'recover':
      if (b.t >= b.dur) setBoss('idle', p2 ? 0.7 : 1.0);
      break;
    case 'stun':
      if (b.t >= b.dur) setBoss('idle', 0.8);
      break;
    case 'dead':
      if (Math.random() < 0.5) sparks(b.x + rand(-80, 80), GY - rand(20, 140), 6, Math.random() < 0.5 ? '#ffd24a' : '#ff6a3a');
      G.shake = 0.3;
      if (b.t > 3.2 && G.state === 'play') setState('clear');
      break;
  }
  b.x = clamp(b.x, b.w / 2 + 10, S.width - b.w / 2 - 10);
  // ボス本体との接触
  if (b.st !== 'dead' && b.st !== 'intro' && rectsOverlap(bossRect(b), pRect())) {
    hurtPlayer(b.st === 'atk' && b.atk === 'charge' ? 26 : 14, b.x);
  }
}
function endAttack(recoverTime) {
  setBoss('recover', recoverTime);
  G.bossBanner = { text: '反撃チャンス！ 「攻撃」で叩け！', t: recoverTime, color: '#7cf3ff' };
}

function damageBoss(raw, kind) {
  const b = G.boss;
  if (!b || b.dead || b.st === 'intro' || b.st === 'dead') return;
  let m, armored = false;
  if (b.st === 'stun') m = kind === 'special' ? 2.2 : 1.5;
  else if (b.st === 'recover') m = 1;
  else { m = kind === 'special' ? 0.6 : 0.3; armored = true; }
  const dmg = Math.max(1, Math.round(raw * m));
  b.hp -= dmg; b.hitF = 0.12;
  pop(b.x + rand(-40, 40), GY - b.h - 10, armored ? 'ガード ' + dmg : dmg, armored ? '#9fb0c8' : '#ffe27a');
  sparks(b.x + (G.p.x < b.x ? -60 : 60), GY - rand(40, 120), 6, armored ? '#9fb0c8' : '#ffe27a');
  if (kind === 'basic') G.p.gauge = Math.min(SP_MAX, G.p.gauge + (armored ? 2 : 5));
  if (kind === 'special' && !armored) G.shake = 0.35;
  if (b.hp <= 0) {
    b.hp = 0; b.dead = true; setBoss('dead', 0); G.eprojs = []; b.cols = [];
    G.p.invuln = 99; G.p.moveDir = 0;
    G.bossBanner = { text: 'ヴォイドクイーン撃破！', t: 3, color: '#ffd24a' };
  }
}

function updateProjectiles(dt) {
  const p = G.p, S = G.stage;
  for (let i = G.eprojs.length - 1; i >= 0; i--) {
    const q = G.eprojs[i];
    q.x += q.vx * dt; q.life -= dt;
    let dead = q.life <= 0 || q.x < -50 || q.x > S.width + 50;
    if (!dead && Math.abs(q.x - q.x0) > 900) dead = true;
    if (!dead && q.kind === 'shock' && !overGround(q.x)) dead = true;
    if (!dead && S.blocks.some(k => rectsOverlap(projRect(q), k))) { dead = true; sparks(q.x, q.y, 5, '#fff'); }
    if (!dead && !p.dead && rectsOverlap(projRect(q), pRect())) {
      if (p.dashInv <= 0 && p.invuln <= 0) { hurtPlayer(q.dmg, q.x); dead = true; }
    }
    if (dead) G.eprojs.splice(i, 1);
  }
  for (let i = G.pwaves.length - 1; i >= 0; i--) {                       // 必殺技の衝撃波
    const w = G.pwaves[i];
    w.x += w.vx * dt; w.dist += Math.abs(w.vx) * dt;
    const r = { x: w.x - w.w / 2, y: w.y - w.h / 2, w: w.w, h: w.h };
    const dmg = 45 * (p.buff > 0 ? 1.8 : 1);
    for (const e of G.enemies) if (!e.dead && !w.hit.has(e) && rectsOverlap(r, enemyRect(e))) { w.hit.add(e); damageEnemy(e, dmg, true); }
    const b = G.boss;
    if (b && !w.hit.has(b) && !b.dead && rectsOverlap(r, bossRect(b))) { w.hit.add(b); damageBoss(dmg * 1.55, 'special'); }
    for (let j = G.eprojs.length - 1; j >= 0; j--) if (rectsOverlap(r, projRect(G.eprojs[j]))) { sparks(G.eprojs[j].x, G.eprojs[j].y, 5, '#bff'); G.eprojs.splice(j, 1); }
    if (Math.random() < 0.7) parts(w.x, w.y + rand(-40, 40), 1, '#9ff', 40, 0);
    if (w.dist > 780 || w.x < -80 || w.x > S.width + 80) G.pwaves.splice(i, 1);
  }
}

function updateHazards(dt) {
  const S = G.stage, p = G.p, pr = pRect();
  for (const s of S.saws) {
    s.x += s.dir * s.speed * dt; s.rot += s.dir * dt * 12;
    if (s.x > s.x1) s.dir = -1; if (s.x < s.x0) s.dir = 1;
    const cx = clamp(s.x, pr.x, pr.x + pr.w), cy = clamp(GY - s.r, pr.y, pr.y + pr.h);
    if ((cx - s.x) ** 2 + (cy - (GY - s.r)) ** 2 < (s.r - 2) ** 2) hurtPlayer(12, s.x);
  }
  for (const w of S.sweepers) {
    w.x += w.dir * w.speed * dt;
    if (w.x > w.x1) w.dir = -1; if (w.x < w.x0) w.dir = 1;
    if (rectsOverlap({ x: w.x - w.w / 2, y: w.y0, w: w.w, h: w.y1 - w.y0 }, pr)) hurtPlayer(12, w.x);
  }
  for (const g of S.gates) {
    const ph = (G.t + g.offset) % g.period;
    g.active = ph < g.on; g.warn = !g.active && ph > g.period - 0.7;
    if (g.active && rectsOverlap({ x: g.x - g.w / 2, y: GY - 230, w: g.w, h: 230 }, pr)) hurtPlayer(18, g.x);
  }
}

function updateItems(dt) {
  const p = G.p, pr = pRect();
  pr.x -= 6; pr.w += 12; pr.y -= 6; pr.h += 12;
  for (const it of G.items) {
    it.t += dt;
    if (it.taken) continue;
    if (rectsOverlap(pr, { x: it.x - 16, y: it.y - 16 + Math.sin(it.t * 3) * 3, w: 32, h: 32 })) {
      it.taken = true;
      if (it.type === 'heal') { p.potions = Math.min(5, p.potions + 1); notify('回復薬を入手！（所持 ' + p.potions + '）「回復」で使用', '#ff7a8a'); }
      else if (it.type === 'gauge') { p.gauge = Math.min(SP_MAX, p.gauge + 50); notify('必殺技ゲージ +50！', '#6fd7ff'); }
      else { p.buff = 12; notify('攻撃力アップ！ 12秒間 ×1.8', '#ffb35a'); }
      sparks(it.x, it.y, 12, it.type === 'heal' ? '#ff7a8a' : (it.type === 'gauge' ? '#6fd7ff' : '#ffb35a'));
    }
  }
  G.items = G.items.filter(it => !it.taken);
  G.stage.items = G.items;
}

function updateEffects(dt) {
  for (const q of G.parts) { q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += (q.g || 0) * dt; }
  G.parts = G.parts.filter(q => q.life > 0);
  for (const q of G.pops) { q.t -= dt; q.y -= 28 * dt; }
  G.pops = G.pops.filter(q => q.t > 0);
  G.shake = Math.max(0, G.shake - dt); G.hurtFlash = Math.max(0, G.hurtFlash - dt);
  if (G.callout) { G.callout.t -= dt; if (G.callout.t <= 0) G.callout = null; }
  if (G.bossBanner) { G.bossBanner.t -= dt; if (G.bossBanner.t <= 0) G.bossBanner = null; }
}

function updateWorld(dt) {
  const p = G.p, S = G.stage;
  G.stats.time += dt;
  updatePlayer(dt);
  if (G.state !== 'play') return;
  updateHazards(dt);
  updateEnemies(dt);
  updateBoss(dt);
  updateProjectiles(dt);
  updateItems(dt);
  if (G.boss && !G.boss.dead) {                         // ボス戦では定期的に支援アイテムが出現
    G.itemTimer -= dt;
    if (G.itemTimer <= 0) {
      G.itemTimer = 16;
      if (G.items.length < 3) {
        const r = Math.random();
        G.items.push({ x: rand(200, S.width - 200), y: GY - 34, type: r < 0.45 ? 'heal' : (r < 0.85 ? 'gauge' : 'power'), t: 0, taken: false });
      }
    }
  }
  if (S.goal && p.x >= S.goal) {
    setState('stageClear'); G.callout = null;
    sparks(S.goal, GY - 60, 30, '#ffd24a');
  }
}

function update(dt) {
  G.t += dt; G.stateT += dt;
  switch (G.state) {
    case 'stageIntro': updateEffects(dt); if (G.stateT > 2.6) setState('play'); break;
    case 'play': updateWorld(dt); updateEffects(dt); break;
    case 'dying': {
      const p = G.p; p.vx = approach(p.vx, 0, 600 * dt); moveBody(p, dt, 1);
      updateEffects(dt); G.eprojs.length = 0;
      if (G.stateT > 1.5) setState('gameover');
      break;
    }
    case 'stageClear':
      updateEffects(dt);
      if (G.stateT > 3.4) startStage(G.stageIdx + 1, false);
      break;
    default: updateEffects(dt);
  }
  const p = G.p, S = G.stage;
  if (p && S) {
    const target = clamp(p.x - W * 0.4, 0, Math.max(0, S.width - W));
    G.cam += (target - G.cam) * Math.min(1, dt * 8);
    G.cam = clamp(G.cam, 0, Math.max(0, S.width - W));
  }
}

// ---------------------------------------------------------- 音声コマンドの実行
function onCommand(id) {
  switch (G.state) {
    case 'test':
      if (id === 'jump') testSuccess();
      else { const t = $('testStatus'); if (t) t.innerHTML = '「' + CMDS[id].label + '」を認識しました。テストでは<b>「ジャンプ」</b>と言ってください。'; }
      break;
    case 'gameover':
      if (G.stateT > 1.2 && (id === 'retry' || id === 'jump')) startStage(G.stageIdx, false);
      else if (G.stateT > 1.2 && id === 'restart') startStage(0, true);
      break;
    case 'clear':
      if (G.stateT > 3 && (id === 'retry' || id === 'restart' || id === 'jump')) startStage(0, true);
      break;
    case 'play': execCommand(id); break;
    default: break;
  }
}

function callout(text, ok) { G.callout = { text, ok, t: ok ? 0.9 : 1.1, dur: ok ? 0.9 : 1.1 }; }

function execCommand(id) {
  const p = G.p;
  if (p.dead) return;
  switch (id) {
    case 'right': case 'left': {
      const d = id === 'right' ? 1 : -1;
      p.face = d;
      if (p.crouch) { callout('しゃがみ中は移動できません（「立て」で解除）', false); return; }
      p.moveDir = d; p.moveTimer = MOVE_TIME;
      callout(d > 0 ? '右！' : '左！', true);
      break;
    }
    case 'jump':
      if (!p.onGround) { callout('空中ではジャンプできません', false); return; }
      p.crouch = false; p.h = STAND_H; p.vy = -JUMPV; p.onGround = false;
      callout('ジャンプ！', true); break;
    case 'crouch':
      if (!p.onGround) { callout('空中ではしゃがめません', false); return; }
      if (p.crouch) { callout('すでにしゃがんでいます（「立て」で解除）', false); return; }
      p.crouch = true; p.h = CROUCH_H; p.moveDir = 0; p.moveTimer = 0; p.dashT = 0;
      callout('しゃがめ！', true); break;
    case 'stand':
      if (!p.crouch) { callout('すでに立っています', false); return; }
      p.crouch = false; p.h = STAND_H; callout('立て！', true); break;
    case 'attack':
      if (p.atkCool > 0) return;
      p.atkT = 0.3; p.atkCool = 0.42; p.atkHit = new Set();
      callout('攻撃！', true); break;
    case 'dash':
      if (p.dashCool > 0) return;
      p.crouch = false; p.h = STAND_H;
      p.dashT = DASH_T; p.dashInv = DASH_INV; p.dashCool = 0.9; p.moveDir = p.face; p.moveTimer = 1.0;
      callout('ダッシュ！', true); break;
    case 'stop':
      p.moveDir = 0; p.moveTimer = 0; p.dashT = 0; callout('止まれ！', true); break;
    case 'special':
      if (p.gauge < SP_COST) { callout('必殺技ゲージが足りません（' + SP_COST + '必要）', false); return; }
      if (p.spT > 0) return;
      p.gauge -= SP_COST; p.spT = 0.45; p.moveDir = 0; p.moveTimer = 0;
      G.pwaves.push({ x: p.x + p.face * 30, y: p.y - 50, w: 64, h: 100, vx: p.face * 660, dist: 0, hit: new Set(), dir: p.face });
      G.shake = Math.max(G.shake, 0.15);
      callout('必殺技！', true); break;
    case 'heal':
      if (p.potions <= 0) { callout('回復薬がありません', false); return; }
      if (p.hp >= p.maxhp) { callout('体力は満タンです', false); return; }
      p.potions--; p.hp = Math.min(p.maxhp, p.hp + 45); p.healFx = 0.8;
      for (let i = 0; i < 14; i++) parts(p.x + rand(-16, 16), p.y - rand(0, p.h), 1, '#7dff8d', 20, -70);
      pop(p.x, p.y - p.h - 12, '+45', '#7dff8d');
      callout('回復！', true); break;
    default: break;
  }
}

// ---------------------------------------------------------- エフェクト補助
function pop(x, y, text, color) { G.pops.push({ x, y, text: String(text), color, t: 1 }); }
function sparks(x, y, n, color) { for (let i = 0; i < n; i++) { const a = rand(0, 6.28), s = rand(60, 260); G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: rand(0.25, 0.6), max: 0.6, color, size: rand(2, 5), g: 500 }); } }
function parts(x, y, n, color, spread, vy) { for (let i = 0; i < n; i++) G.parts.push({ x, y, vx: rand(-spread, spread), vy: vy + rand(-20, 20), life: rand(0.3, 0.7), max: 0.7, color, size: rand(2, 4), g: 0 }); }

// ---------------------------------------------------------- 6) 描画処理
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

function drawBackground() {
  const S = G.stage, c = ctx, cam = G.cam, t = G.t;
  if (S.theme === 'forest') {
    let g = c.createLinearGradient(0, 0, 0, GY); g.addColorStop(0, '#07142a'); g.addColorStop(1, '#17503f');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.fillStyle = 'rgba(255,255,255,.8)';
    for (let i = 0; i < 46; i++) c.fillRect((hash(i) * W * 1.3 - cam * 0.03 + W * 2) % W, hash(i + 77) * 220, 2, 2);
    c.fillStyle = '#d9f1ff'; c.beginPath(); c.arc(790, 90, 34, 0, 7); c.fill();
    c.fillStyle = '#0a1d33'; c.beginPath(); c.arc(802, 84, 30, 0, 7); c.fill();
    c.fillStyle = '#0d2a35'; c.beginPath(); c.moveTo(0, GY);
    for (let x = 0; x <= W + 40; x += 40) c.lineTo(x, GY - 120 - 50 * Math.sin((x + cam * 0.15) * 0.006) - 30 * Math.sin((x + cam * 0.15) * 0.017));
    c.lineTo(W, GY); c.fill();
    for (const [f, sp, col, hh] of [[0.35, 110, '#0b3a30', 190], [0.65, 150, '#0a2f27', 250]]) {
      c.fillStyle = col;
      const k0 = Math.floor(cam * f / sp) - 1;
      for (let k = k0; k < k0 + W / sp + 3; k++) {
        const x = k * sp - cam * f, h = hh * (0.7 + hash(k + f * 10) * 0.5);
        c.fillRect(x - 6, GY - h * 0.3, 12, h * 0.3);
        c.beginPath(); c.moveTo(x - 46, GY - h * 0.25); c.lineTo(x, GY - h); c.lineTo(x + 46, GY - h * 0.25); c.fill();
        c.beginPath(); c.moveTo(x - 38, GY - h * 0.5); c.lineTo(x, GY - h * 1.12); c.lineTo(x + 38, GY - h * 0.5); c.fill();
      }
    }
    for (let i = 0; i < 18; i++) {                         // 音に反応する蛍
      const fx = (hash(i * 3) * W * 2 - cam * 0.5 + 4 * W) % (W + 40), fy = 250 + hash(i) * 170 + Math.sin(t * 1.5 + i) * 12;
      c.fillStyle = 'rgba(190,255,150,' + (0.35 + 0.35 * Math.sin(t * 3 + i)) + ')'; c.beginPath(); c.arc(fx, fy, 2.4, 0, 7); c.fill();
    }
  } else if (S.theme === 'lab') {
    let g = c.createLinearGradient(0, 0, 0, GY); g.addColorStop(0, '#080d1c'); g.addColorStop(1, '#1b2748');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    for (const [f, sp, col] of [[0.25, 160, 'rgba(60,90,160,.18)'], [0.5, 120, 'rgba(70,110,190,.2)']]) {
      const k0 = Math.floor(cam * f / sp) - 1;
      for (let k = k0; k < k0 + W / sp + 3; k++) {
        const x = k * sp - cam * f; c.fillStyle = col; c.fillRect(x, 40, sp - 16, GY - 40);
        c.fillStyle = 'rgba(120,200,255,' + (0.1 + 0.1 * hash(k)) + ')'; c.fillRect(x + 12, 70 + hash(k) * 80, sp - 40, 40);
      }
    }
    c.strokeStyle = 'rgba(90,140,220,.35)'; c.lineWidth = 6;
    for (let y of [70, 110]) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
    c.lineWidth = 2;
    for (let i = 0; i < 4; i++) {                          // 反響する音波のリング
      const r = ((t * 70 + i * 90) % 360); c.strokeStyle = 'rgba(80,220,255,' + (0.28 * (1 - r / 360)) + ')';
      c.beginPath(); c.arc(W * 0.7 - cam * 0.1, 210, r, 0, 7); c.stroke();
    }
  } else {
    let g = c.createLinearGradient(0, 0, 0, GY); g.addColorStop(0, '#12061a'); g.addColorStop(1, '#3a1233');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.fillStyle = 'rgba(255,60,90,.07)'; c.beginPath(); c.arc(W / 2, 250, 260 + Math.sin(t * 2) * 12, 0, 7); c.fill();
    c.strokeStyle = 'rgba(220,200,255,.14)'; c.lineWidth = 1.5;
    for (let i = 0; i < 9; i++) {                          // クモの巣
      const cx = (i * 330 - cam * 0.3) % (W + 400) - 100, cy = 120 + (i % 3) * 40;
      for (let a = 0; a < 8; a++) { c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(a * .785) * 130, cy + Math.sin(a * .785) * 130); c.stroke(); }
      for (let r = 40; r <= 120; r += 40) { c.beginPath(); c.arc(cx, cy, r, 0, 7); c.stroke(); }
    }
    c.fillStyle = '#1b0a22';
    for (let k = Math.floor(cam * 0.5 / 70) - 1; k < Math.floor(cam * 0.5 / 70) + 16; k++) {
      const x = k * 70 - cam * 0.5, h = 40 + hash(k) * 110;
      c.beginPath(); c.moveTo(x - 24, 0); c.lineTo(x + 24, 0); c.lineTo(x, h); c.fill();
    }
  }
}

function drawGround() {
  const S = G.stage, c = ctx, cam = G.cam;
  c.fillStyle = '#03050a'; c.fillRect(0, GY, W, H - GY);
  const pal = { forest: ['#46b25f', '#2b3322', '#141a12'], lab: ['#6fa8ff', '#273250', '#121a30'], nest: ['#c27ae0', '#35173b', '#170a1c'] }[S.theme];

  }

}

// ---- ボス描画
function drawBoss() {
  const b = G.boss; if (!b) return;
  const c = ctx, x = b.x - G.cam;
  const p2 = b.phase === 2, hit = b.hitF > 0;
  const tele = b.st === 'tele', atk = b.st === 'atk', stun = b.st === 'stun', rec = b.st === 'recover';
  // 予告表示
  if (tele && b.atk === 'sweep') {
    c.fillStyle = 'rgba(255,60,60,' + (0.28 + 0.14 * Math.sin(G.t * 22)) + ')'; c.fillRect(b.dir > 0 ? x + b.w / 2 : x - b.w / 2 - 700, GY - 30, 700, 30);
  } else if (tele && b.atk === 'spit') {
    c.fillStyle = 'rgba(255,60,150,' + (0.28 + 0.14 * Math.sin(G.t * 22)) + ')'; c.fillRect(b.dir > 0 ? x + b.w / 2 : x - b.w / 2 - 700, GY - 62, 700, 20);
  } else if (tele && b.atk === 'charge') {
    c.fillStyle = 'rgba(255,200,60,' + (0.12 + 0.12 * Math.sin(G.t * 22)) + ')'; c.fillRect(b.dir > 0 ? x : x - 800, GY - 150, 800, 150);
    c.fillStyle = '#ffd24a'; c.font = 'bold 40px ' + FONT; c.textAlign = 'center';
    for (let i = 1; i <= 4; i++) c.fillText(b.dir > 0 ? '▶' : '◀', x + b.dir * (150 + i * 120), GY - 60);
  }
  if (b.atk === 'rain' && (tele || atk)) for (const col of b.cols) {
    const cx = col.x - G.cam;
    if (tele) { c.fillStyle = 'rgba(255,50,70,' + (0.2 + 0.25 * Math.abs(Math.sin(G.t * 16))) + ')'; c.fillRect(cx - 37, GY - 6, 74, 6); c.fillRect(cx - 37, 0, 74, GY); c.fillStyle = 'rgba(255,50,70,.1)'; c.fillRect(cx - 37, 0, 74, GY); }
    else if (col.t > 0.05 && col.t < 0.45) {
      const gr = c.createLinearGradient(cx - 37, 0, cx + 37, 0); gr.addColorStop(0, '#6a3a8a'); gr.addColorStop(.5, '#e5c8ff'); gr.addColorStop(1, '#6a3a8a');
      c.fillStyle = gr; c.fillRect(cx - 37, 0, 74, GY); c.fillStyle = '#fff'; c.beginPath(); c.moveTo(cx - 37, GY); c.lineTo(cx, GY + 24); c.lineTo(cx + 37, GY); c.fill();
    }
  }
  c.save(); c.translate(x, b.y); c.scale(b.dir, 1);
  let shake = 0;
  if (tele && b.atk === 'charge') shake = Math.sin(G.t * 60) * 4;
  if (stun) shake = Math.sin(G.t * 40) * 2;
  if (b.st === 'dead') shake = Math.sin(G.t * 70) * 6;
  c.translate(shake, 0);
  c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(0, 2, 110, 8, 0, 0, 7); c.fill();
  const body = hit ? '#fff' : (p2 ? '#7a1f3d' : '#4b2a78'), dark = hit ? '#ddd' : (p2 ? '#4a0f26' : '#2c1650');
  // 脚
  c.lineCap = 'round'; c.lineJoin = 'round';
  for (let i = 0; i < 4; i++) {
    for (const side of [-1, 1]) {
      const ax = -52 + i * 34 + (side > 0 ? 12 : 0), ay = -78;
      let kx = ax + side * 10 + (i - 1.5) * 14, ky = -150 - (i % 2) * 14, fx = ax + (i - 1.5) * 34 + side * 20, fy = 0;
      if (side > 0 && i === 3) {                       // 最前脚: 攻撃の予告・実行
        if (tele && b.atk === 'sweep') { kx = ax + 50; ky = -170; fx = ax + 110; fy = -120 + Math.sin(G.t * 30) * 4; }
        else if (atk && b.atk === 'sweep') { kx = ax + 70; ky = -60; fx = ax + 150; fy = -6; }
      }
      if (tele && b.atk === 'charge') fy += 0;
      const bounce = (atk && b.atk === 'charge') ? Math.sin(G.t * 30 + i * 2) * 8 : 0;
      c.strokeStyle = side > 0 ? body : dark; c.lineWidth = 11;
      c.beginPath(); c.moveTo(ax, ay); c.lineTo(kx, ky); c.lineTo(fx, fy + bounce * 0); c.stroke();
      c.lineWidth = 5; c.strokeStyle = 'rgba(255,255,255,.12)'; c.beginPath(); c.moveTo(ax, ay); c.lineTo(kx, ky); c.stroke();
    }
  }
  // 胴体
  c.fillStyle = body; c.beginPath(); c.ellipse(-8, -88, 86, 56, 0, 0, 7); c.fill();
  c.fillStyle = dark; c.beginPath(); c.ellipse(-52, -92, 44, 40, 0, 0, 7); c.fill();
  c.fillStyle = hit ? '#eee' : (p2 ? '#ff3a6a' : '#b06bff');
  for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(-40 + i * 24, -134); c.lineTo(-30 + i * 24, -154 - (i === 1 ? 10 : 0)); c.lineTo(-20 + i * 24, -134); c.fill(); }
  // 頭
  const lift = (tele && b.atk === 'spit') ? -34 : 0, drop = (stun ? 36 : 0);
  c.fillStyle = body; c.beginPath(); c.arc(70, -96 + lift + drop, 36, 0, 7); c.fill();
  c.fillStyle = p2 ? '#ff2a4a' : '#ffd24a';
  for (let i = 0; i < 3; i++) { c.beginPath(); c.arc(62 + i * 12, -104 + lift + drop - (i === 1 ? 6 : 0), 5, 0, 7); c.fill(); }
  c.beginPath(); c.arc(76, -92 + lift + drop, 3.4, 0, 7); c.fill();
  c.fillStyle = '#fff'; c.beginPath(); c.moveTo(90, -84 + lift + drop); c.lineTo(98, -66 + lift + drop); c.lineTo(80, -82 + lift + drop); c.fill();
  if ((tele && b.atk === 'spit') || (atk && b.atk === 'spit')) {
    c.fillStyle = 'rgba(230,230,255,' + (0.5 + 0.4 * Math.sin(G.t * 30)) + ')'; c.beginPath(); c.arc(104, -76 + lift, 10, 0, 7); c.fill();
  }
  if (stun) { c.fillStyle = '#ffe27a'; c.font = 'bold 30px ' + FONT; c.textAlign = 'center'; c.scale(b.dir, 1); c.fillText('★ ☆ ★', 0, -176 + Math.sin(G.t * 8) * 4); }
  c.restore();
  if (rec || stun) {                                 // 反撃チャンスの枠
    c.strokeStyle = 'rgba(124,243,255,' + (0.5 + 0.4 * Math.sin(G.t * 14)) + ')'; c.lineWidth = 4; c.setLineDash([10, 8]);
    c.strokeRect(x - b.w / 2 - 8, GY - b.h - 28, b.w + 16, b.h + 28); c.setLineDash([]);
  }
  if (tele && b.atk !== 'rain') {
    c.fillStyle = '#ff4a4a'; c.font = 'bold 54px ' + FONT; c.textAlign = 'center'; c.fillText('!', x + b.dir * 10, GY - b.h - 40);
  }
}

function drawEffectsAndHud() {
  const c = ctx;
  for (const q of G.parts) {
    c.globalAlpha = clamp(q.life / q.max, 0, 1); c.fillStyle = q.color; c.fillRect(q.x - G.cam - q.size / 2, q.y - q.size / 2, q.size, q.size);
  }
  c.globalAlpha = 1;
  c.textAlign = 'center';
  for (const q of G.pops) {
    c.globalAlpha = clamp(q.t * 1.6, 0, 1); c.font = 'bold 20px ' + FONT; c.lineWidth = 4; c.strokeStyle = 'rgba(0,0,0,.8)';
    c.strokeText(q.text, q.x - G.cam, q.y); c.fillStyle = q.color; c.fillText(q.text, q.x - G.cam, q.y);
  }
  c.globalAlpha = 1;
  if (G.hurtFlash > 0) {                                             // ダメージ時の赤い縁
    const gr = c.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, 560); gr.addColorStop(0, 'rgba(255,0,30,0)'); gr.addColorStop(1, 'rgba(255,0,30,' + (G.hurtFlash * 1.6) + ')');
    c.fillStyle = gr; c.fillRect(0, 0, W, H);
  }
  // 認識したコマンドの表示
  if (G.callout && (G.state === 'play')) {
    const k = G.callout, age = k.dur - k.t, sc = 1 + Math.max(0, 0.18 - age) * 3;
    c.save(); c.translate(W / 2, k.ok ? 150 : 135); c.scale(sc, sc); c.globalAlpha = clamp(k.t / 0.25, 0, 1);
    c.font = (k.ok ? 'bold 52px ' : 'bold 22px ') + FONT; c.lineWidth = 7; c.strokeStyle = 'rgba(0,10,30,.9)'; c.strokeText(k.text, 0, 0);
    c.fillStyle = k.ok ? '#8ff3ff' : '#ffc9c9'; c.fillText(k.text, 0, 0); c.restore();
  }
  // ボスのHPバー・予告バナー
  const b = G.boss;
  if (b) {
    const bx = 350, bw = 360, bc = bx + bw / 2;
    c.fillStyle = 'rgba(0,0,0,.65)'; c.fillRect(bx, 16, bw, 26);
    c.fillStyle = b.phase === 2 ? '#ff4a6a' : '#b06bff'; c.fillRect(bx + 4, 20, (bw - 8) * (b.hp / b.maxhp), 18);
    c.strokeStyle = '#fff'; c.lineWidth = 2; c.strokeRect(bx, 16, bw, 26);
    c.fillStyle = '#fff'; c.font = 'bold 15px ' + FONT; c.fillText(b.name + (b.phase === 2 ? '（激怒）' : ''), bc, 59);
  }
  if (G.bossBanner && G.state === 'play') {
    const k = G.bossBanner; c.font = 'bold 26px ' + FONT;
    const tw = c.measureText(k.text).width + 40;
    c.fillStyle = 'rgba(0,0,0,.65)'; rr(c, W / 2 - tw / 2, 72, tw, 42, 10); c.fill();
    c.fillStyle = k.color; c.fillText(k.text, W / 2, 101);
  }
  if (G.state === 'stageIntro') {
    const a = clamp(Math.min(G.stateT / 0.4, (2.6 - G.stateT) / 0.5), 0, 1);
    c.globalAlpha = a; c.fillStyle = 'rgba(0,0,0,.55)'; c.fillRect(0, 160, W, 190);
    c.fillStyle = '#35e0ff'; c.font = 'bold 22px ' + FONT; c.fillText('STAGE ' + (G.stageIdx + 1), W / 2, 205);
    c.fillStyle = '#fff'; c.font = 'bold 44px ' + FONT; c.fillText(G.stage.name.replace(/^ステージ\d：/, ''), W / 2, 262);
    c.fillStyle = '#cfe6ff'; c.font = '18px ' + FONT; c.fillText(G.stage.hint, W / 2, 310);
    c.globalAlpha = 1;
  }
  if (G.state === 'stageClear') {

    c.globalAlpha = a; c.fillStyle = 'rgba(0,0,0,.55)'; c.fillRect(0, 170, W, 170);
    c.fillStyle = '#ffd24a'; c.font = 'bold 60px ' + FONT; c.fillText('STAGE CLEAR!', W / 2, 250);
    c.fillStyle = '#fff'; c.font = '20px ' + FONT; c.fillText('次のステージへ進みます…', W / 2, 300); c.globalAlpha = 1;
  }
  if (G.state === 'play' && G.p.crouch) {
    c.fillStyle = 'rgba(255,226,122,.95)'; c.font = 'bold 16px ' + FONT;
    c.fillText('しゃがみ中 ─ 「立て」と言うまで維持', G.p.x - G.cam, G.p.y - 54);
  }
}

function render() {
  const c = ctx;
  c.setTransform(scale, 0, 0, scale, 0, 0);
  c.clearRect(0, 0, W, H);
  if (!G.stage) { c.fillStyle = '#05080f'; c.fillRect(0, 0, W, H); drawIdleBackdrop(); return; }
  c.save();
  if (G.shake > 0) c.translate(rand(-1, 1) * G.shake * 14, rand(-1, 1) * G.shake * 14);
  drawBackground(); drawGround(); drawSigns(); drawBlocks(); drawHazards(); drawGoal(); drawItems();
  for (const e of G.enemies) drawEnemy(e);
  drawBoss();
  const dead = G.p.dead && G.state !== 'play';
  if (dead) { c.save(); c.translate(G.p.x - G.cam, G.p.y); c.rotate(Math.min(1.5, G.stateT * 3) * -G.p.face); c.translate(-(G.p.x - G.cam), -G.p.y); drawPlayer(); c.restore(); }
  else drawPlayer();
  drawProjectiles();
  c.restore();
  c.save(); if (G.shake > 0) c.translate(rand(-1, 1) * G.shake * 6, rand(-1, 1) * G.shake * 6);
  drawEffectsAndHud(); c.restore();
}
function drawIdleBackdrop() {
  const c = ctx; const t = performance.now() / 1000;
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#07142a'); g.addColorStop(1, '#17503f'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.strokeStyle = 'rgba(80,220,255,.25)'; c.lineWidth = 2;
  for (let i = 0; i < 5; i++) { const r = (t * 80 + i * 100) % 500; c.globalAlpha = 1 - r / 500; c.beginPath(); c.arc(W / 2, H / 2, r, 0, 7); c.stroke(); }
  c.globalAlpha = 1;
}

function refreshStatus() {
  const m = $('micTag'), a = $('asrTag');
  const micTxt = { idle: ['マイク：未確認', ''], asking: ['マイク：許可待ち', 'warn'], granted: ['マイク：許可済み', 'ok'], denied: ['マイク：拒否されています', 'bad'],
    nodevice: ['マイク：見つかりません', 'bad'], busy: ['マイク：他アプリが使用中', 'bad'], error: ['マイク：エラー', 'bad'], unsupported: ['マイク：利用不可', 'bad'] }[V.mic];
  m.textContent = micTxt[0]; m.className = 'tag ' + micTxt[1];
  let at, cls;

  else if (V.rec === 'listening') { at = V.speaking ? '音声認識：音声を検出中…' : '音声認識：待機中（話してください）'; cls = V.speaking ? 'hear' : 'ok'; }
  else if (V.rec === 'starting') { at = '音声認識：起動中…'; cls = 'warn'; }
  else if (V.rec === 'restarting') { at = '音声認識：再起動中…'; cls = 'warn'; }

  else { at = '音声認識：停止中'; cls = ''; }

}

    '<div class="big">「<b>ジャンプ</b>」と言ってください</div>' +
    '<div class="stat" id="testStatus">マイクに向かって、はっきり話してください。</div>' +
    '<div class="heardbox" id="testHeard">（認識した言葉がここに表示されます）</div>' +
    '<p class="note">・画面右上の「音声認識」が「待機中」または「音声を検出中」になっていれば聞き取れています。<br>' +
    '・認識されない場合：マイクの許可、入力デバイス、ネット接続、周囲の雑音を確認し、少し間を置いて「ジャンプ」と言ってみてください。</p>' +
    '<button class="btn ghost" id="btnSkip">テストを省略して開始（準備用ボタン）</button></div>';
}
function gameoverHTML() {
  return '<div class="panel"><h1 style="font-size:3em;filter:none;background:linear-gradient(90deg,#ff5a6a,#a02040);-webkit-background-clip:text;background-clip:text">GAME OVER</h1>' +
    '<p class="big" style="font-size:1.5em">「<b>もう一度</b>」または「<b>ジャンプ</b>」でこのステージをやり直し</p>' +
    '<p class="sub">「はじめから」と言うとステージ1から再開します</p><div class="stat">撃破数：' + G.stats.kills + '</div></div>';
}
function clearHTML() {
  const s = Math.floor(G.stats.time), mm = Math.floor(s / 60), ss = String(s % 60).padStart(2, '0');
  return '<div class="panel"><h1>GAME CLEAR!</h1><p class="big" style="font-size:1.4em">ヴォイドクイーンを倒し、巣に静寂が戻った。</p>' +
    '<div class="stat">撃破数：' + G.stats.kills + ' ／ クリアタイム：' + mm + '分' + ss + '秒</div>' +
    '<p class="sub">あなたの声が世界を救いました！</p>' +
    '<p class="big" style="font-size:1.2em">「<b>もう一度</b>」と言うと、最初から遊べます</p></div>';
}
function showMicProblem(msg, fix) {
  showOverlay('<div class="panel"><h1 style="font-size:2em;filter:none">マイク・音声認識を開始できません</h1><p class="fail big" style="font-size:1.1em">' + esc(msg) + '</p>' +
    '<div class="steps"><b>対処方法</b><br>・' + esc(fix) + '<br>・Chrome / Edge のアドレスバー左の鍵（またはマイク）アイコン → 「マイク」を「許可」にしてページを再読み込み<br>' +
    '・OSの設定でブラウザのマイク使用が許可されているか確認<br>・https:// または http://localhost で開いているか確認（file:// では毎回許可が必要／動かない場合があります）</div>' +
    '<button class="btn" id="btnAgain">もう一度試す</button></div>');
  const b = $('btnAgain'); if (b) b.onclick = () => { V.fatal = ''; hideWarn(); beginVoice(); };
}

async function beginVoice() {
  setState('test'); showHud(false);
  showOverlay(testHTML());
  $('btnSkip').onclick = () => { startGameFromTest(); };
  const r = await requestMic();
  if (r !== 'ok') {
    const m = {
      denied: ['マイクの使用が許可されませんでした。', 'ブラウザのマイク許可ダイアログで「許可」を選んでください。'],
      nodevice: ['マイクが見つかりません。', 'マイクを接続し、OSの入力デバイス設定を確認してください。'],
      busy: ['マイクを他のアプリが使用中、または読み取れません。', '通話アプリなどを終了してからやり直してください。'],
      unsupported: ['このブラウザではマイクにアクセスできません。', 'PC版 Chrome / Edge を、https または localhost で開いてください。'],
      error: ['マイクの初期化に失敗しました。', 'ブラウザを再起動し、マイクの設定を確認してください。']
    }[r];
    showMicProblem(m[0], m[1]); return;
  }
  startRec();
}
async function retryVoice() {
  const r = await requestMic();
  if (r === 'ok') startRec();
  else showWarn('マイクを使用できません（' + r + '）。', 'ブラウザのマイク許可と入力デバイスを確認してください。', true);
}
function testSuccess() {
  const t = $('testStatus'); if (t) t.innerHTML = '<span class="success">✔ 認識成功！「ジャンプ」を確認しました。まもなくゲーム開始…</span>';
  G.testOk = true;
  setTimeout(() => { if (G.state === 'test') startGameFromTest(); }, 1500);
}
function startGameFromTest() {
  if (G.state !== 'test') return;
  if (!V.want && V.supported && !V.fatal && V.mic === 'granted') startRec();
  startStage(0, true);
}

// -- 画面サイズ対応
function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight, dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.max(2, Math.round(w * dpr)); cv.height = Math.max(2, Math.round(h * dpr));
  scale = cv.width / W; wrap.style.fontSize = (w / 60) + 'px';
}
window.addEventListener('resize', resize);

// -- メインループ
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  try { update(dt); render(); updateHUD(); }
  catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}

// -- 起動
$('cmdbar').innerHTML = CHIPS.map(c => '<div class="chip" data-cmd="' + c[0] + '"><b>' + c[1] + '</b><small>' + c[2] + '</small></div>').join('');
resize(); refreshStatus();
showOverlay(introHTML());
const bs = $('btnStart'); if (bs) bs.onclick = () => beginVoice();
requestAnimationFrame(frame);

// 開発者コンソール用テストフック（ゲームプレイには使用しません）：
//   VOICE_BREAK_TEST.say('ジャンプ') で、音声認識結果が届いた場合と同じ経路でコマンドを処理します。
window.VOICE_BREAK_TEST = {
  say(text, finalOnly) {
    const idx = fakeIndex++;
    const mk = (fin) => ({ resultIndex: idx, results: Object.assign(new Array(idx + 1).fill(null).map(() => [{ transcript: '', confidence: 0 }]),
      { [idx]: Object.assign([{ transcript: text, confidence: 0.9 }], { isFinal: fin }) }) });
    if (!finalOnly) handleResult(mk(false));
    handleResult(mk(true));
  },
  state: () => ({ state: G.state, hp: G.p && G.p.hp, crouch: G.p && G.p.crouch, x: G.p && G.p.x, y: G.p && G.p.y, vx: G.p && G.p.vx, gauge: G.p && G.p.gauge, potions: G.p && G.p.potions, stage: G.stageIdx, boss: G.boss && { hp: G.boss.hp, st: G.boss.st } }),
  G
};
})();
</script>
</body>
